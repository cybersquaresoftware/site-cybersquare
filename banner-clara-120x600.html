<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão corporativo Clara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0E2A5C;
    --tinta-2:#1B3F82;
    --papel:#F5F7FB;
    --branco:#FFFFFF;
    --sol:#FFC93C;
    --cinza:#5A6478;
    --display:"Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
    --texto:"Figtree", "Segoe UI", Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:120px;height:600px;overflow:hidden;background:var(--papel)}

  .banner{display:flex;flex-direction:column;width:120px;height:600px;
    text-decoration:none;color:var(--tinta);font-family:var(--texto);
    border:1px solid #DCE2EE;background:var(--papel);overflow:hidden}
  .banner:focus-visible{outline:3px solid var(--sol);outline-offset:-3px}

  .selo{margin:14px 10px 0;align-self:flex-start;font-size:10.5px;font-weight:600;
    background:var(--sol);padding:4px 8px;border-radius:999px;line-height:1.2}

  h1{margin:14px 10px 0;font-family:var(--display);font-weight:800;
    font-size:19px;line-height:1.05;letter-spacing:-.01em}

  .sub{margin:10px 10px 0;font-size:12px;line-height:1.35;color:var(--cinza)}

  /* Cartão vertical, como no hero da LP */
  .palco{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .cartao{position:relative;width:78px;height:124px;border-radius:12px;padding:10px 9px;
    background:var(--tinta);color:var(--branco);transform:rotate(-8deg);overflow:hidden;
    box-shadow:0 14px 26px -10px rgba(14,42,92,.6);animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
  .cartao::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;
    background:var(--tinta-2);right:-50px;top:-50px}
  .cartao::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;
    border:13px solid var(--sol);left:-30px;bottom:-34px}
  .cartao > *{position:relative;z-index:1}
  .marca{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em}
  .chip{width:22px;height:16px;border-radius:4px;margin-top:12px;background:linear-gradient(135deg,#F3D27A,#C99A2E)}
  .tipo{position:absolute;right:8px;bottom:9px;font-size:8.5px;font-weight:600;
    background:rgba(255,255,255,.16);padding:2px 6px;border-radius:999px}
  @keyframes entra{from{opacity:0;transform:rotate(-16deg) translateY(16px)}to{opacity:1;transform:rotate(-8deg)}}

  .oferta{margin:0 10px;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15}
  .oferta span{display:block;font-family:var(--texto);font-weight:500;font-size:11.5px;color:var(--cinza);margin-top:5px;line-height:1.3}

  .cta{margin:14px 10px 0;padding:11px 6px;text-align:center;background:var(--tinta);color:var(--branco);
    font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15;border-radius:10px;
    box-shadow:0 4px 0 var(--sol);transition:transform .12s ease, box-shadow .12s ease}
  .banner:hover .cta{transform:translateY(2px);box-shadow:0 2px 0 var(--sol)}

  .nota{margin:12px 10px 12px;font-size:9px;line-height:1.3;color:var(--cinza)}

  @media (prefers-reduced-motion:reduce){.cartao{animation:none}.cta{transition:none}}
</style>
</head>
<body>
  <a class="banner" href="https://share.clara.com/meYzD9A" target="_blank" rel="noopener"
     aria-label="Pedir o cartão corporativo virtual da Clara">
    <span class="selo">Tem CNPJ?</span>
    <h1>Conta da empresa no seu cartão pessoal?</h1>
    <p class="sub">Separe isso de vez.</p>

    <div class="palco" aria-hidden="true">
      <div class="cartao">
        <div class="marca">Clara</div>
        <div class="chip"></div>
        <span class="tipo">Virtual</span>
      </div>
    </div>

    <p class="oferta">Cartão corporativo virtual
      <span>Cadastro online em poucos minutos.</span>
    </p>
    <span class="cta">Pedir meu cartão</span>
    <p class="nota">Link de indicação. Aprovação e condições definidas pela Clara.</p>
  </a>
</body>
</html>
